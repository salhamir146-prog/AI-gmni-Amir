<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Classic — Gemini Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-primary" id="newChatBtn"><i class="fa-solid fa-plus"></i> گفتگوی جدید</button>
                <button class="icon-btn" id="closeSidebarBtn"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
            <div class="sidebar-footer">
                <a href="#" id="openSettingsLink"><i class="fa-solid fa-gear"></i> تنظیمات و مدل‌ها</a>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="chat-header">
                <button class="icon-btn" id="openSidebarBtn"><i class="fa-solid fa-bars"></i></button>
                <div class="model-badge" id="modelDropdownBadge">
                    <span id="modelCatIcon"><i class="fa-solid fa-comment-dots"></i></span>
                    <span id="currentModelName">Gemini 3.6 Flash</span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 11px; opacity: 0.7;"></i>
                </div>
                <div class="user-plan online" id="connStatus"><span class="dot"></span> متصل</div>
            </header>

            <div class="model-context-bar" id="modelContextBar" style="display: none;"></div>

            <div class="chat-content" id="chatContent">
                <!-- Welcome Screen -->
                <div class="welcome-container" id="welcomeContainer">
                    <div class="welcome-logo"><i class="fa-solid fa-sparkles"></i></div>
                    <h2>امروز چطور می‌توانم کمکتان کنم؟</h2>
                    <div class="suggestion-chips" id="suggestionChips"></div>
                </div>

                <!-- Messages List -->
                <div class="messages-list" id="messagesList" style="display: none;"></div>
            </div>

            <!-- Input Area -->
            <div class="input-area-wrapper">
                <div class="input-box">
                    <!-- دکمه و اینپت فایل برای ارسال عکس -->
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button type="button" class="action-btn" id="uploadBtn" title="ارسال تصویر"><i class="fa-solid fa-paperclip"></i></button>
                    
                    <textarea id="promptInput" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
                    <button class="send-btn" id="sendBtn" disabled><i class="fa-solid fa-arrow-up"></i></button>
                </div>
                <div class="input-footer">هوش مصنوعی ممکن است اشتباه کند. اطلاعات مهم را بررسی کنید.</div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>تنظیمات پیشرفته</h3>
                <button class="icon-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="models">مدل‌ها و پارامترها</button>
                <button class="modal-tab" data-tab="system">دستورالعمل سیستم</button>
                <button class="modal-tab" data-tab="memory">حافظه بلندمدت</button>
            </div>
            <div class="modal-body">
                <div class="tab-panel active" data-panel="models">
                    <div class="form-group">
                        <label>دسته‌بندی مدل‌ها</label>
                        <div class="category-pills" id="categoryPills"></div>
                    </div>
                    <div class="form-group">
                        <label>انتخاب مدل</label>
                        <select class="form-control" id="modelSelect"></select>
                        <div class="model-desc" id="modelDescBox"></div>
                    </div>
                    <div class="dynamic-params" id="dynamicParams"></div>
                </div>
                <div class="tab-panel" data-panel="system">
                    <div class="form-group">
                        <label>دستورالعمل سیستمی (System Instruction)</label>
                        <textarea class="form-control" id="systemInstruction" rows="5" placeholder="رفتار یا شخصیت ربات را تعیین کنید..."></textarea>
                    </div>
                </div>
                <div class="tab-panel" data-panel="memory">
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label style="margin: 0;">حافظه هوشمند بلندمدت (KV)</label>
                            <label class="switch"><input type="checkbox" id="memoryEnabledToggle"><span class="slider"></span></label>
                        </div>
                        <textarea class="form-control" id="memoryBox" rows="6" readonly placeholder="نکات پایدار استخراج‌شده از گفتگوها..."></textarea>
                        <button class="btn-danger" id="clearMemoryBtn" style="margin-top: 10px;">پاک‌سازی حافظه</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="themeToggleBtn" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
                <button class="btn-primary" id="saveSettingsBtn">ذخیره و اعمال</button>
            </div>
        </div>
    </div>

    <!-- Toast Stack -->
    <div class="toast-stack" id="toastStack"></div>

    <script src="app.js"></script>
</body>
</html>
