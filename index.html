<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Classic — Gemini Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ۱. سایدبار سمت راست -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn" class="btn-new-chat">
        <i class="fa-solid fa-plus"></i> گفتگوی جدید
      </button>
      <button id="closeSidebarBtn" class="icon-btn" title="بستن سایدبار">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="chatHistoryList" class="chat-history-list">
      <div id="historyEmpty" class="history-empty">هیچ گفتگویی ذخیره نشده</div>
    </div>
    <div style="padding: 12px; border-top: 1px solid var(--border-color);">
      <a href="#" id="openSettingsLink" style="font-size: 13px; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-gear"></i> تنظیمات و مدل‌ها
      </a>
    </div>
  </aside>

  <!-- ۲. صفحه اصلی چت (پرکننده سمت چپ) -->
  <main id="mainApp">
    <!-- هدر بالای چت -->
    <header class="top-bar">
      <div class="top-bar-right">
        <button id="openSidebarBtn" class="icon-btn" title="باز کردن سایدبار">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div id="modelDropdownBadge" class="model-badge">
          <span id="modelCatIcon"><i class="fa-solid fa-comment-dots"></i></span>
          <span id="currentModelName">Gemini 3.6 Flash</span>
          <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
        </div>
      </div>
      <div class="top-bar-left">
        <button id="themeToggleBtn" class="icon-btn" title="تغییر تم">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="settingsGearBtn" class="icon-btn" title="تنظیمات">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </header>

    <!-- محتوای پیام‌ها -->
    <div id="chatContent" class="chat-content">
      <div id="welcomeContainer" class="welcome-container">
        <h1 class="welcome-title">چطور می‌توانم کمکتان کنم؟</h1>
        <div id="suggestionChips" class="suggestion-chips"></div>
      </div>

      <div id="messagesList" class="messages-list" style="display: none;"></div>
    </div>

    <!-- باکس ارسال پیام -->
    <div class="input-container">
      <div class="input-box">
        <div id="fileNameDisplay" class="file-badge-container"></div>
        <textarea id="promptInput" rows="1" placeholder="هر چه می‌خواهید بپرسید..."></textarea>
        <div class="input-actions">
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="fileUploadBtn" class="icon-btn" title="آپلود فایل">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <input type="file" id="fileInput" style="display: none;">
          </div>
          <button id="sendBtn" class="send-btn" disabled>
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </div>
      <div style="text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 6px;">
        Gemini ممکن است اطلاعات نادرستی ارائه دهد. پاسخ‌ها را بررسی کنید.
      </div>
    </div>
  </main>

  <!-- ۳. مدال تنظیمات (مستقیماً زیر body قرار دارد) -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-sliders"></i> تنظیمات</h3>
        <button id="closeModalBtn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="model">مدل</button>
        <button class="modal-tab" data-tab="params">پارامترها</button>
        <button class="modal-tab" data-tab="system">سیستم</button>
        <button class="modal-tab" data-tab="memory">حافظه</button>
      </div>
      <div class="modal-body">
        <div class="tab-panel active" data-panel="model">
          <label style="font-size: 12px; color: var(--text-muted);">دسته بندی</label>
          <div id="categoryPills" class="cat-pills"></div>
          <label style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">انتخاب مدل</label>
          <select id="modelSelect" class="select-input"></select>
          <div id="modelDescBox" style="font-size: 12px; color: var(--text-muted); background: var(--bg-secondary); padding: 8px; border-radius: 6px; margin-top: 8px;"></div>
        </div>
        <div class="tab-panel" data-panel="params">
          <div id="dynamicParams"></div>
        </div>
        <div class="tab-panel" data-panel="system">
          <label style="font-size: 12px; color: var(--text-muted);">دستورالعمل سیستم (System Prompt)</label>
          <textarea id="systemInstruction" class="textarea-input" placeholder="مثلاً: پاسخ‌ها را کوتاه و کاربردی ارائه بده..."></textarea>
        </div>
        <div class="tab-panel" data-panel="memory">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <span style="font-size: 13px;">فعال‌سازی حافظه بلندمدت</span>
            <input type="checkbox" id="memoryEnabledToggle" checked>
          </div>
          <textarea id="memoryBox" class="textarea-input" readonly placeholder="نکات ذخیره‌شده درباره شما..."></textarea>
          <button id="clearMemoryBtn" class="btn-secondary" style="color: #ef4444; border-color: #ef4444; margin-top: 8px;"><i class="fa-solid fa-trash"></i> پاک‌سازی حافظه</button>
        </div>
      </div>
      <div class="modal-footer">
        <button id="testConnBtn" class="btn-secondary"><i class="fa-solid fa-plug"></i> تست اتصال</button>
        <button id="saveSettingsBtn" class="btn-primary">ذخیره تغییرات</button>
      </div>
    </div>
  </div>

  <div id="toastStack" class="toast-stack"></div>

  <script src="app.js"></script>
</body>
</html>
