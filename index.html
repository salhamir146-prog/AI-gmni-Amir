<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Chat</title>
  
  <!-- فونت‌های استاندارد فارسی و کد نویسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- آیکون‌های FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- استایل اصلی -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- سایدبار تاریخچه و منو -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn" class="btn-new-chat">
        <i class="fa-solid fa-plus"></i>
        <span>گفتگوی جدید</span>
      </button>
      <button id="closeSidebarBtn" class="icon-btn mobile-only" title="بستن منو">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="chatHistoryList" class="chat-history-list">
      <div class="history-section-title">گفتگوهای اخیر</div>
      <div id="historyEmpty" class="history-empty">هیچ گفتگویی ذخیره نشده است</div>
    </div>

    <div class="sidebar-footer">
      <button id="openSettingsBtn" class="sidebar-footer-btn">
        <i class="fa-solid fa-gear"></i>
        <span>تنظیمات و مدل‌ها</span>
      </button>
    </div>
  </aside>

  <!-- بخش اصلی برنامه -->
  <main id="mainApp" class="main-app">
    
    <!-- هدر بالای صفحه -->
    <header class="top-bar">
      <div class="top-bar-right">
        <button id="openSidebarBtn" class="icon-btn" title="باز کردن سایدبار">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div id="modelSelectorDropdown" class="model-badge" title="تغییر مدل فعلی">
          <span class="model-icon"><i class="fa-solid fa-bolt"></i></span>
          <span id="currentModelName">Gemini 1.5 Flash</span>
          <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
        </div>
      </div>

      <div class="top-bar-left">
        <button id="themeToggleBtn" class="icon-btn" title="تغییر حالت شب/روز">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="settingsGearBtn" class="icon-btn" title="تنظیمات">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
    </header>

    <!-- منطقه نمایش پیام‌ها و خوش‌آمدگویی -->
    <div id="chatContent" class="chat-content">
      
      <!-- حالت اولیه (خوش‌آمدگویی) -->
      <div id="welcomeContainer" class="welcome-container">
        <div class="welcome-icon">
          <i class="fa-solid fa-sparkles"></i>
        </div>
        <h1 class="welcome-title">چطور می‌توانم کمکتان کنم؟</h1>
      </div>

      <!-- لیست پیام‌های ارسال و دریافت شده -->
      <div id="messagesList" class="messages-list" style="display: none;"></div>

    </div>

    <!-- فرم ورودی پیام کاربر -->
    <div class="input-wrapper">
      <div class="input-box">
        <textarea id="promptInput" rows="1" placeholder="هر چه می‌خواهید بپرسید..." autofocus></textarea>
        
        <div class="input-actions">
          <div class="input-actions-left">
            <button id="fileUploadBtn" class="icon-btn action-btn" title="آپلود فایل یا تصویر">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <input type="file" id="fileInput" hidden multiple accept="image/*, .pdf, .txt, .js, .html, .css">
          </div>
          
          <div class="input-actions-right">
            <button id="sendBtn" class="send-btn" title="ارسال پیام" disabled>
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="disclaimer-text">
        Gemini ممکن است اطلاعات نادرستی ارائه دهد، پاسخ‌ها را بررسی کنید.
      </div>
    </div>

  </main>

  <!-- مدال تنظیمات عمومی و مدل -->
  <div id="settingsModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3><i class="fa-solid fa-sliders"></i> تنظیمات سیستم</h3>
        <button id="closeModalBtn" class="icon-btn" title="بستن"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="model">انتخاب مدل</button>
        <button class="modal-tab" data-tab="system">دستورالعمل سیستم</button>
      </div>

      <div class="modal-body">
        <!-- تب تنظیمات مدل -->
        <div class="tab-panel active" data-panel="model">
          <div class="form-group">
            <label class="input-label" for="modelSelect">مدل هوش مصنوعی</label>
            <select id="modelSelect" class="select-input">
              <option value="gemini-1.5-flash">Gemini 1.5 Flash (سریع و بهینه)</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro (پیشرفته و دقیق)</option>
            </select>
          </div>
        </div>

        <!-- تب دستورالعمل سیستم -->
        <div class="tab-panel" data-panel="system">
          <div class="form-group">
            <label class="input-label" for="systemInstruction">دستورالعمل اختصاصی (System Prompt)</label>
            <textarea id="systemInstruction" class="textarea-input" placeholder="مثلاً: همواره پاسخ‌ها را کاملاً خلاصه و به زبان فارسی رسمی ارائه بده..."></textarea>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="saveSettingsBtn" class="btn-primary">ذخیره تغییرات</button>
      </div>
    </div>
  </div>

  <!-- اسکریپت اصلی -->
  <script src="app.js"></script>
</body>
</html>
